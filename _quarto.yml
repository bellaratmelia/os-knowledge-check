# Quarto project configuration for the self-assessment quiz website.
# The site is a static Quarto "website" project, which renders to plain
# HTML/CSS/JS in the output directory and can be published as-is on GitHub Pages.

brand: _brand.yml
project:
  type: website
  output-dir: _site
  # Ensure the question bank CSV is copied into the published site so the quiz
  # can fetch it at runtime. (FileAttachment also pulls it in, but listing it
  # here as a resource is a belt-and-suspenders guarantee for GitHub Pages.)
  resources:
    - data/questions.csv
  render:
    - "*.qmd"
    - "!README_forUpdating.qmd"

website:
  # Absolute base URL. Required so open-graph / twitter-card images resolve to
  # full URLs — social scrapers can't load relative image paths. Must match the
  # live GitHub Pages URL (the repo name is the path), so keep this in sync if
  # the repo is ever renamed.
  site-url: https://bellaratmelia.github.io/oskc
  title: "Open Scholarship Knowledge Check"
  description: "A self-assessment for librarians, research support professionals, and researchers interested in open scholarship."
  page-footer: "Made with love and [Quarto](https://quarto.org/) by [Bella Ratmelia](https://bellaratmelia.github.io/) + Claude Fable 5 & Opus 4.8 - [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)."
  reader-mode: false
  favicon: logo/oskc-favicon-512.png
  open-graph:
    image: logo/oskc-social-card.png
  twitter-card:
    image: logo/oskc-social-card.png
  navbar:
    logo: logo/oskc-typelogo.png
    logo-alt: "Open Scholarship Knowledge Check"
    title: false          # the lockup already contains the title
    background: light
    pinned: true
    left:
      - href: index.qmd
        text: Quiz
      - href: about.qmd
        text: About
      - href: development.qmd
        text: Development  
    tools:
      - icon: github
        href: https://github.com/bellaratmelia/oskc/  
  google-analytics: "G-LFMJ6DP6TP"
  cookie-consent: express


format:
  html:
    # Zephyr is the Bootstrap base; styles.scss layers the custom quiz styling
    # on top. Listing them as a theme array (rather than a separate `css:` file)
    # lets styles.scss participate in Sass compilation, so it can read Bootstrap
    # variables and the brand tokens from _brand.yml.
    theme:
      - zephyr
      - styles.scss
    toc: true
    toc-location: left
    page-layout: article
    grid:
      body-width: 900px 
    include-in-header:
      # Improve mobile rendering (Quarto sets a viewport by default, but we make it explicit).
      # Fonts are not loaded here: Public Sans + Source Serif 4 come from the brand
      # system (_brand.yml), served via Bunny Fonts.
      text: |
        <meta name="viewport" content="width=device-width, initial-scale=1">
    include-before-body:
      # "Skip to main content" link for keyboard and screen-reader users, so they can
      # bypass the repeated navbar on every page. Visually hidden until it receives
      # keyboard focus (see .qa-skip-link in styles.css). Targets #quarto-document-content,
      # the wrapper Quarto renders around each page's actual content.
      text: |
        <a class="qa-skip-link" href="#quarto-document-content">Skip to main content</a>
